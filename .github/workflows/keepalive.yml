name: Supabase keep-alive
on:
  schedule:
    # Supabase pauses free projects without "a few user requests to the database each day" for a week.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          set -a; source .env; set +a
          for q in "games?select=id&limit=1" "games?select=key,name" "games?select=id&built_in=eq.true"; do
            curl -fsS "$VITE_SUPABASE_URL/rest/v1/$q" -H "apikey: $VITE_SUPABASE_KEY" > /dev/null
          done
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
